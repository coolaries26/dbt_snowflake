snapshots:
    - name: dim_listings
      relation: ref('listing')
      config:
        target_schema: gold
        target_database: abnb
        strategy: check
        check_cols:
          - LISTING_ID
          - PROPERTY_TYPE
          - ROOM_TYPE
          - CITY
          - COUNTRY
          - PRICE_CATEGORY
          - CREATED_AT
        updated_at: CREATED_AT
        tags: ['dim_listings']
        unique_key: listing_ID
        dbt_valid_to_current: "to_date('9999-12-31')"