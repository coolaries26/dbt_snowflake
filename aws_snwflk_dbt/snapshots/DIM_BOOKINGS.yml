snapshots:
  - name: dim_bookings
    relation: ref('booking')
    config:
      target_schema: gold
      target_database: abnb
      strategy: check
      check_cols:
        - BOOKING_ID
        - BOOKING_DATE
        - BOOKING_STATUS
        - BOOKING_CREATED_AT
      unique_key: BOOKING_ID
      dbt_valid_to_current: "to_date('9999-12-31')"